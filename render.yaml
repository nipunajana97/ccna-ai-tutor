# This blueprint provisions paid compute plus a disk. Review Render's cost before applying.
services:
  - type: web
    name: ccna-ai-tutor
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python start.py
    healthCheckPath: /_stcore/health
    disk:
      name: ccna-tutor-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: DEMO_MODE
        value: "false"
      - key: LOCAL_AI_TEST
        value: "false"
      - key: AI_PROVIDER
        value: ollama
      - key: DATA_DIR
        value: /var/data/ccna
      - key: BILLING_MODE
        value: test
      - key: OLLAMA_MODEL
        value: qwen3:1.7b
      - key: OLLAMA_EMBEDDING_MODEL
        value: nomic-embed-text:v1.5
      - key: STRIPE_PRICE_ID
        value: price_1UQdZaCvG4xAhKW62tQteiuU
      - key: STRIPE_PAYMENT_LINK
        value: https://buy.stripe.com/test_aFa7sKfRceuj6BsfQk6wE00
      - key: AUTH_COOKIE_SECRET
        generateValue: true
      # Provision a separate model server first. Render does not connect to your PC's localhost.
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_AUTH_TOKEN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
